name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Compile tests
        run: npm run compile-tests

      - name: Test (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: npm test

      - name: Package VSIX
        if: matrix.os == 'ubuntu-latest'
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cursor-plans-history-vsix
          path: "*.vsix"
